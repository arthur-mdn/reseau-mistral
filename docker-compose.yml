services:
  reseau-mistral-mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - reseau_mistral_mongodb_data:/data/db
      - ./mongo/mongod.conf:/etc/mongo/mongod.conf:ro
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  reseau-mistral-server:
    build:
      context: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      DB_URI: mongodb://reseau-mistral-mongodb:27017/reseau-mistral
      CLIENT_URL: http://localhost:5173
      PORT: 3001
      NODE_ENV: development
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      reseau-mistral-mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  reseau-mistral-client:
    build:
      context: ./client
      args:
        VITE_INSTANCE_URL: "http://localhost:5173"
        VITE_SERVER_URL: "http://localhost:3001"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - reseau-mistral-server
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  reseau_mistral_mongodb_data:
